<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Tiers | Ysf's Fortress</title>
    <style>
        /* --- RED FORTRESS THEME --- */
        :root {
            --primary-red: #D32F2F;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
            --text-white: #ffffff;
            --text-grey: #a0a0a0;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            /* Animated Red Background */
            background: radial-gradient(circle at center, #2a0000 0%, #0a0a0a 100%);
            background-attachment: fixed;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { background-color: #0a0a0a; }
            100% { background-color: #1a0000; }
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid var(--primary-red);
        }

        .gamemode-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
        }

        .gamemode-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }

        .gamemode-nav button:hover, .gamemode-nav button.active {
            background: var(--primary-red);
            border-color: #ff4444;
            box-shadow: 0 0 10px var(--primary-red);
        }

        /* --- LEADERBOARD TABLE --- */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
        }

        th { background: #1f1f1f; padding: 15px; text-align: left; color: var(--primary-red); }
        td { padding: 15px; border-bottom: 1px solid #222; }
        tr:hover { background: #1c1c1c; }

        .rank-tag {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        /* --- ADMIN PANEL --- */
        #admin-auth, #admin-controls {
            background: #1a1a1a;
            padding: 20px;
            border: 2px dashed var(--primary-red);
            margin-top: 50px;
            border-radius: 10px;
        }

        input, select {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
        }

        .btn-main {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- PLAYER CARD MODAL --- */
        #player-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: #141414;
            border: 2px solid var(--primary-red);
            border-radius: 15px;
            padding: 30px;
            z-index: 100;
            text-align: center;
        }

        .overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            z-index: 90;
        }
    </style>
</head>
<body>

<header>
    <h1 style="color: var(--primary-red); margin:0;">SPLASH TIERS</h1>
    <p>The Official Middle East Competitive Leaderboard</p>
</header>

<nav class="gamemode-nav">
    <button onclick="renderLeaderboard()" class="active">Overall</button>
    <button>Sword</button><button>Axe</button><button>Pot</button>
    <button>Neth Pot</button><button>UHC</button><button>SMP</button>
    <button>Dia SMP</button><button>Cart</button><button>Mace</button>
    <button>Vanilla</button>
</nav>

<div class="container">
    <table id="lb-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Player</th>
                <th>Rank</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody id="lb-body"></tbody>
    </table>

    <!-- Admin Section -->
    <div id="admin-auth">
        <h3>Staff Login</h3>
        <input type="text" id="user-input" placeholder="Username">
        <input type="password" id="pass-input" placeholder="Password">
        <button class="btn-main" onclick="checkAdmin()">Login</button>
    </div>

    <div id="admin-controls" style="display:none;">
        <h3>Admin: Manage Players</h3>
        <input type="text" id="p-name" placeholder="Player IGN">
        <select id="p-tier">
            <option value="HT1">HT1 (60 pts)</option>
            <option value="LT1">LT1 (45 pts)</option>
            <option value="HT2">HT2 (20 pts)</option>
            <option value="LT2">LT2 (20 pts)</option>
            <option value="HT3">HT3 (10 pts)</option>
            <option value="LT3">LT3 (6 pts)</option>
            <option value="HT4">HT4 (4 pts)</option>
            <option value="LT4">LT4 (3 pts)</option>
            <option value="HT5">HT5 (2 pts)</option>
            <option value="LT5">LT5 (1 pt)</option>
        </select>
        <button class="btn-main" onclick="addOrUpdatePlayer()">Save Player Data</button>
        <button onclick="logout()" style="background:none; color:grey; border:none; cursor:pointer;">Logout</button>
    </div>
</div>

<!-- Player Card Modal -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="player-modal">
    <button onclick="closeModal()" style="float:right; background:none; border:none; color:white; cursor:pointer;">X</button>
    <h2 id="modal-name" style="color:var(--primary-red)"></h2>
    <div id="modal-rank" class="rank-tag"></div>
    <hr style="border:0.5px solid #333; margin:20px 0;">
    <p>Position: <span id="modal-pos"></span></p>
    <p>Overall Points: <span id="modal-points"></span> / 600</p>
</div>

<script>
    // --- DATABASE & LOGIC ---
    let players = JSON.parse(localStorage.getItem('splash_db')) || [];
    
    const pointsTable = {
        'HT1': 60, 'LT1': 45, 'HT2': 20, 'LT2': 20, 
        'HT3': 10, 'LT3': 6, 'HT4': 4, 'LT4': 3, 
        'HT5': 2, 'LT5': 1
    };

    function getRank(pts) {
        if (pts >= 500) return "Splash Master";
        if (pts >= 400) return "Grand Master";
        if (pts >= 250) return "Master";
        if (pts >= 100) return "Ace";
        if (pts >= 50) return "Specialist";
        if (pts >= 20) return "Cadet";
        if (pts >= 10) return "Novice";
        return "Rookie";
    }

    // --- RENDER LEADERBOARD ---
    function renderLeaderboard() {
        const body = document.getElementById('lb-body');
        body.innerHTML = '';
        
        // AUTO-SORT: Highest points first
        players.sort((a, b) => b.points - a.points);

        players.forEach((p, index) => {
            const row = `
                <tr onclick="showPlayer(${index})">
                    <td>${index + 1}</td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="rank-tag" style="background: #330000; border: 1px solid red;">${getRank(p.points)}</span></td>
                    <td>${p.points}</td>
                </tr>
            `;
            body.innerHTML += row;
        });
    }

    // --- ADMIN ACTIONS ---
    function checkAdmin() {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        if(u === "Ysplash_MC" && p === "lord.of.rings") {
            document.getElementById('admin-auth').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'block';
        } else { alert("Access Denied."); }
    }

    function addOrUpdatePlayer() {
        const name = document.getElementById('p-name').value;
        const tier = document.getElementById('p-tier').value;
        const pts = pointsTable[tier];

        if(!name) return alert("Enter a name");

        let existing = players.find(x => x.name.toLowerCase() === name.toLowerCase());
        if(existing) {
            existing.points = pts; // In a full version, this would sum all 10 modes
        } else {
            players.push({ name: name, points: pts });
        }

        localStorage.setItem('splash_db', JSON.stringify(players));
        renderLeaderboard();
        alert("Saved & Auto-Sorted!");
    }

    function logout() { location.reload(); }

    // --- MODAL ACTIONS ---
    function showPlayer(index) {
        const p = players[index];
        document.getElementById('modal-name').innerText = p.name;
        document.getElementById('modal-rank').innerText = getRank(p.points);
        document.getElementById('modal-pos').innerText = "#" + (index + 1);
        document.getElementById('modal-points').innerText = p.points;
        
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('player-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('player-modal').style.display = 'none';
    }

    renderLeaderboard();
</script>

</body>
</html>
