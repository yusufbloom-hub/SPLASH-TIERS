<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>
:root {
    --bg: #090e17;
    --card: #111827;
    --card-hover: #151f32;
    --modal-bg: #111827;
    --border: #1f2937;
    --text-muted: #6b7280;
    --cyan: #38bdf8;
    
    /* Official MCTiers Color Swatches */
    --t1-color: #ef4444; 
    --t2-color: #f97316; 
    --t3-color: #eab308; 
    --t4-color: #22c55e; 
    --t5-color: #3b82f6; 
    --none-color: #374151;

    --gold: #f59e0b;
    --silver: #9ca3af;
    --bronze: #b45309;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
    background: var(--bg);
    color: #f3f4f6;
    padding: 30px 15px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* Header Elements */
.header-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.brand-logo {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    color: white;
}

.meta-action-btns {
    display: flex;
    align-items: center;
    gap: 10px;
}

.action-btn {
    text-decoration: none;
    color: #9ca3af;
    background: #111827;
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: 0.2s;
    cursor: pointer;
}

.action-btn:hover {
    color: white;
    background: var(--card-hover);
    border-color: #4b5563;
}

/* Music Player Controls Toggle Button */
.music-btn {
    background: #1e1b4b;
    border-color: #4338ca;
    color: #a5b4fc;
}
.music-btn:hover {
    background: #312e81;
    color: white;
}

/* Navigation Filters Grid Bar */
.filter-navbar {
    display: flex;
    background: #111827;
    border: 1px solid var(--border);
    padding: 6px;
    border-radius: 12px;
    gap: 5px;
    margin-bottom: 30px;
    overflow-x: auto;
    align-items: center;
}

.nav-tab {
    background: none;
    border: none;
    color: #9ca3af;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    white-space: nowrap;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.nav-tab img {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.nav-tab:hover {
    color: white;
}

.nav-tab.active {
    background: #1f2937;
    color: white;
}

/* OVERALL LEADERBOARD MODE VIEW */
.overall-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.mctiers-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s, transform 0.2s;
}

.mctiers-card:hover {
    background: var(--card-hover);
}

.card-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
}

.player-identity-box {
    display: flex;
    align-items: center;
    gap: 16px;
}

.podium-placement-tag {
    font-size: 28px;
    font-weight: 900;
    font-style: italic;
    width: 35px;
    color: #4b5563;
}

.pos-1 .podium-placement-tag { color: var(--gold); }
.pos-2 .podium-placement-tag { color: var(--silver); }
.pos-3 .podium-placement-tag { color: var(--bronze); }

.avatar-wrapper {
    position: relative;
    width: 64px;
    height: 64px;
}

.avatar-wrapper img {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    object-fit: cover;
}

.pos-1 .avatar-wrapper::after { content: ''; position: absolute; inset: 0; border-radius: 10px; border: 2px solid var(--gold); }

.identity-meta h2 {
    font-size: 22px;
    font-weight: 800;
    color: white;
}

.identity-meta p {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.points-txt-span {
    color: #9ca3af;
}

.region-pill {
    background: #ef4444;
    color: white;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 6px;
    text-transform: uppercase;
}

.region-pill.EU { background: #22c55e; }

/* Circular Gamemode Micro-Badges */
.card-tiers-shelf {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    border-top: 1px solid #1f2937;
    padding-top: 16px;
}

.circular-badge-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 46px;
}

.icon-circle-frame {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #1f2937;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    padding: 6px;
}

.icon-circle-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.badge-lbl-subtext {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 4px;
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    white-space: nowrap;
}

/* Kit Variant CSS Injectors */
.t-ht1, .t-lt1 { border-color: var(--t1-color); background: var(--t1-color); color: white; }
.t-ht2, .t-lt2 { border-color: var(--t2-color); background: var(--t2-color); color: white; }
.t-ht3, .t-lt3 { border-color: var(--t3-color); background: var(--t3-color); color: #111827; }
.t-ht4, .t-lt4 { border-color: var(--t4-color); background: var(--t4-color); color: white; }
.t-ht5, .t-lt5 { border-color: var(--t5-color); background: var(--t5-color); color: white; }
.t-none { background: var(--none-color); color: #9ca3af; }

/* REPLICATED COLUMN TIERS VIEW MODE */
.columns-view-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.tier-board-column {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
}

.column-banner-hdr {
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
}

.column-banner-hdr.tier1-banner { background: rgba(239, 68, 68, 0.1); color: var(--t1-color); }
.column-banner-hdr.tier2-banner { background: rgba(249, 115, 22, 0.1); color: var(--t2-color); }
.column-banner-hdr.tier35-banner { background: rgba(59, 130, 246, 0.1); color: var(--cyan); }

.column-players-stack {
    display: flex;
    flex-direction: column;
}

.column-player-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #1c2533;
}

.column-strip-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.column-strip-left img {
    width: 32px;
    height: 32px;
    border-radius: 6px;
}

.column-strip-left span {
    font-size: 15px;
    font-weight: 700;
    color: #e5e7eb;
}

.exact-subtier-tag {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
}

/* MODAL DESIGN */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.mctiers-modal-frame {
    width: 480px;
    background: var(--modal-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    position: relative;
    text-align: center;
}

.modal-dismiss-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #1f2937;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: #9ca3af;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-dismiss-btn:hover { color: white; }

.modal-portrait-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    padding: 3px;
    margin: 0 auto 16px auto;
}

.modal-portrait-circle img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.modal-profile-title { font-size: 26px; font-weight: 800; color: white; }
.modal-profile-rank { font-size: 15px; font-weight: 700; color: #fbbf24; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px;}
.modal-profile-region { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.modal-metric-strip {
    background: #1f2937;
    border-radius: 10px;
    padding: 14px;
    margin: 20px 0;
    font-size: 15px;
    font-weight: 700;
}

.modal-metric-strip span { color: var(--cyan); }

.modal-grid-shelf {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.modal-grid-box {
    background: #161e2e;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
}

.modal-box-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }

@media (max-width: 768px) {
    .columns-view-board { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Background Music Element (Corrected Direct Track Link) -->
<audio id="ariaMathAudio" loop src="https://archive.org/download/minecraft-volume-beta/Aria%20Math.mp3"></audio>

<div class="container">
    
    <!-- Top Brand Row -->
    <div class="header-wrapper">
        <div class="brand-logo">SPLASH TIERS</div>
        <div class="meta-action-btns">
            <!-- Audio Controller Button System -->
            <button class="action-btn music-btn" id="musicToggleBtn" onclick="togglePlayMusic()">🎵 Play Aria Math</button>
            <a href="#" class="action-btn">🎮 Discord Server</a>
            <a href="#" class="action-btn">🖥️ Server IP: desertiamc.fun</a>
        </div>
    </div>

    <!-- Navigation Filter Toolbar System (Fixed File Paths) -->
    <div class="filter-navbar" id="navTabsContainer">
        <button class="nav-tab active" onclick="switchViewTab('overall')">🏆 Overall</button>
        <button class="nav-tab" onclick="switchViewTab('sword')"><img src="sword.png" onerror="this.style.display='none'"> Sword</button>
        <button class="nav-tab" onclick="switchViewTab('axe')"><img src="axe.png" onerror="this.style.display='none'"> Axe</button>
        <button class="nav-tab" onclick="switchViewTab('pot')"><img src="pot.png" onerror="this.style.display='none'"> Pot</button>
        <button class="nav-tab" onclick="switchViewTab('nethpot')"><img src="nethpot.png" onerror="this.style.display='none'"> NethPot</button>
        <button class="nav-tab" onclick="switchViewTab('uhc')"><img src="uhc.png" onerror="this.style.display='none'"> UHC</button>
        <button class="nav-tab" onclick="switchViewTab('smp')"><img src="smp.png" onerror="this.style.display='none'"> SMP</button>
        <button class="nav-tab" onclick="switchViewTab('vanilla')"><img src="vanilla.png" onerror="this.style.display='none'"> Vanilla</button>
        <button class="nav-tab" onclick="switchViewTab('mace')"><img src="mace.png" onerror="this.style.display='none'"> Mace</button>
        <button class="nav-tab" onclick="switchViewTab('cart')"><img src="cart.png" onerror="this.style.display='none'"> Cart</button>
    </div>

    <!-- Target mounting containers -->
    <div id="dynamicMainContentSlot"></div>

</div>

<!-- Modal Popup Wrapper Structure -->
<div class="modal-overlay" id="profileModalSandbox">
    <div class="mctiers-modal-frame">
        <button class="modal-dismiss-btn" onclick="closeProfileModal()">×</button>
        <div class="modal-portrait-circle">
            <img id="popAvatar" src="">
        </div>
        <div class="modal-profile-title" id="popName"></div>
        <div class="modal-profile-rank" id="popRank"></div>
        <div class="modal-profile-region" id="popRegion"></div>

        <div class="modal-metric-strip">
            POSITION OVERALL: <span id="popPoints"></span>
        </div>

        <div class="modal-grid-shelf">
            <div class="modal-grid-box"><div class="modal-box-lbl">Sword</div><div id="pSword" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">Axe</div><div id="pAxe" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">Pot</div><div id="pPot" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">NethPot</div><div id="pNethPot" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">UHC</div><div id="pUHC" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">SMP</div><div id="pSMP" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">Vanilla</div><div id="pVanilla" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">Mace</div><div id="pMace" class="badge-lbl-subtext"></div></div>
            <div class="modal-grid-box"><div class="modal-box-lbl">Cart</div><div id="pCart" class="badge-lbl-subtext"></div></div>
        </div>
    </div>
</div>

<script>
// Data Engines
const tierPointsMapping = {
    "HT1": 60, "LT1": 50, "HT2": 40, "LT2": 30, "HT3": 25, 
    "LT3": 20, "HT4": 15, "LT4": 10, "HT5": 10, "LT5": 5, "NONE": 0
};

// Configured image mapping directly linked to your GitHub root assets
const gamemodeVisualIcons = {
    sword: "sword.png",
    axe: "axe.png",
    pot: "images (1).png",
    nethpot: "nethop.png",
    uhc: "uhc-1.png",
    smp: "smp.png",
    vanilla: "vanilla.png",
    mace: "mace.png",
    cart: "minecart-e4204998.png"
};

const players = [
    {
        name: "YsplashMC",
        region: "ME",
        avatar: "images/YsplashMC.png",
        sword: "HT5", axe: "HT5", pot: "HT5", nethpot: "LT5", uhc: "HT5", smp: "HT5", vanilla: "HT5", mace: "HT4", cart: "HT5"
    },
    {
        name: "NinjaRLCS",
        region: "ME",
        avatar: "images/NinjaRLCS.png",
        sword: "HT5", axe: "NONE", pot: "NONE", nethpot: "NONE", uhc: "NONE", smp: "NONE", vanilla: "LT5", mace: "LT5", cart: "LT5"
    }
];

let currentActiveTab = "overall";

// Audio Engine Manager Function (Enhanced Error Handled States)
function togglePlayMusic() {
    const audio = document.getElementById("ariaMathAudio");
    const btn = document.getElementById("musicToggleBtn");
    
    if (audio.paused) {
        audio.play().then(() => {
            btn.innerText = "⏸️ Pause Aria Math";
            btn.style.background = "#312e81";
        }).catch(err => {
            console.error("Audio block:", err);
            alert("Tap/Click on the screen background first, then hit Play again so your browser allows the music!");
        });
    } else {
        audio.pause();
        btn.innerText = "🎵 Play Aria Math";
        btn.style.background = "#1e1b4b";
    }
}

function calculateRankName(points) {
    if (points >= 500) return "Combat Grandmaster";
    if (points >= 400) return "Combat Master";
    if (points >= 300) return "Ace";
    if (points >= 200) return "Specialist";
    if (points >= 100) return "Cadat";
    if (points >= 50)  return "Novis";
    return "Rookie";
}

function getBadgeColorStyleClass(tier) {
    if (!tier || tier === "NONE") return "t-none";
    return `t-${tier.toLowerCase()}`;
}

function renderActiveView() {
    const stage = document.getElementById("dynamicMainContentSlot");
    stage.innerHTML = "";

    players.forEach(p => {
        let score = 0;
        ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'].forEach(k => {
            score += tierPointsMapping[p[k] || "NONE"];
        });
        p.points = score;
        p.rank = calculateRankName(score);
    });

    if (currentActiveTab === "overall") {
        players.sort((a, b) => b.points - a.points);
        
        let overlayWrapperHTML = `<div class="overall-list">`;
        players.forEach((player, index) => {
            const place = index + 1;
            
            let kitsTrayHTML = "";
            const totalKitKeys = ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'];
            
            totalKitKeys.forEach(k => {
                const value = player[k] || "NONE";
                kitsTrayHTML += `
                    <div class="circular-badge-node">
                        <div class="icon-circle-frame">
                            <img src="${gamemodeVisualIcons[k]}" alt="${k}">
                        </div>
                        <div class="badge-lbl-subtext ${getBadgeColorStyleClass(value)}">${value}</div>
                    </div>
                `;
            });

            overlayWrapperHTML += `
                <div class="mctiers-card pos-${place}" onclick="openProfilePopupByIndex(${index})">
                    <div class="card-top-row">
                        <div class="player-identity-box">
                            <div class="podium-placement-tag">${place}.</div>
                            <div class="avatar-wrapper">
                                <img src="${player.avatar}" onerror="this.src='https://placehold.co/100x100/1f2937/fff?text=${player.name[0]}'">
                            </div>
                            <div class="identity-meta">
                                <h2>${player.name}</h2>
                                <p><span class="points-txt-span">${player.rank} (${player.points} points)</span></p>
                            </div>
                        </div>
                        <div class="region-pill ${player.region}">${player.region}</div>
                    </div>
                    <div class="card-tiers-shelf">
                        ${kitsTrayHTML}
                    </div>
                </div>
            `;
        });
        overlayWrapperHTML += `</div>`;
        stage.innerHTML = overlayWrapperHTML;

    } else {
        const kitKey = currentActiveTab;
        let t1Players = [], t2Players = [], t35Players = [];
        
        players.forEach(p => {
            const tierValue = p[kitKey] || "NONE";
            if (tierValue.includes("1")) t1Players.push({name: p.name, avatar: p.avatar, sub: tierValue});
            else if (tierValue.includes("2")) t2Players.push({name: p.name, avatar: p.avatar, sub: tierValue});
            else if (tierValue !== "NONE") t35Players.push({name: p.name, avatar: p.avatar, sub: tierValue});
        });

        function populateListColumn(arr) {
            if (arr.length === 0) return `<div style="padding:16px; color:#4b5563; font-size:14px;">No players tiered</div>`;
            return arr.map(p => `
                <div class="column-player-strip">
                    <div class="column-strip-left">
                        <img src="${p.avatar}" onerror="this.src='https://placehold.co/50x50/1f2937/fff?text=${p.name[0]}'">
                        <span>${p.name}</span>
                    </div>
                    <div class="exact-subtier-tag">${p.sub}</div>
                </div>
            `).join('');
        }

        stage.innerHTML = `
            <div class="columns-view-board">
                <div class="tier-board-column">
                    <div class="column-banner-hdr tier1-banner">🏆 Tier 1</div>
                    <div class="column-players-stack">${populateListColumn(t1Players)}</div>
                </div>
                <div class="tier-board-column">
                    <div class="column-banner-hdr tier2-banner">🥈 Tier 2</div>
                    <div class="column-players-stack">${populateListColumn(t2Players)}</div>
                </div>
                <div class="tier-board-column">
                    <div class="column-banner-hdr tier35-banner">🥉 Tier 3-5</div>
                    <div class="column-players-stack">${populateListColumn(t35Players)}</div>
                </div>
            </div>
        `;
    }
}

function switchViewTab(tabName) {
    currentActiveTab = tabName;
    const buttons = document.querySelectorAll(".nav-tab");
    buttons.forEach(b => b.classList.remove("active"));
    
    if(window.event) {
        window.event.currentTarget.classList.add("active");
    }
    renderActiveView();
}

function openProfilePopupByIndex(index) {
    const player = players[index];
    if (!player) return;

    document.getElementById("profileModalSandbox").style.display = "flex";
    document.getElementById("popAvatar").src = player.avatar;
    document.getElementById("popName").innerText = player.name;
    document.getElementById("popRank").innerHTML = `✨ ${player.rank}`;
    document.getElementById("popRegion").innerText = `Region: ${player.region} | Minecraft Java`;
    document.getElementById("popPoints").innerText = `#${index + 1} OVERALL (${player.points} points)`;

    const totalKits = ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'];
    const targetIDs = ['pSword','pAxe','pPot','pNethPot','pUHC','pSMP','pVanilla','pMace','pCart'];

    totalKits.forEach((kit, idx) => {
        const val = player[kit] || "NONE";
        const element = document.getElementById(targetIDs[idx]);
        element.innerText = val;
        element.className = `badge-lbl-subtext ${getBadgeColorStyleClass(val)}`;
    });
}

function closeProfileModal() {
    document.getElementById("profileModalSandbox").style.display = "none";
}

window.onload = renderActiveView;
</script>
</body>
</html>
