<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Tiers | Official Player Card</title>
    <style>
        /* Modern Dark Competitive Theme Style */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The Card Container Layout */
        .player-card {
            background: linear-gradient(145deg, #1f2833, #151a21);
            border: 2px solid #66fcf1;
            border-radius: 12px;
            width: 420px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(102, 252, 241, 0.15);
        }

        /* Top Header Styling */
        .card-header {
            text-align: center;
            border-bottom: 2px solid #45a29e;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .brand-title {
            color: #66fcf1;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .username {
            color: #ffffff;
            font-size: 28px;
            margin: 5px 0;
            font-weight: 800;
        }

        /* Regional & Ranking Badges */
        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .region-badge {
            background-color: #45a29e;
            color: #0b0c10;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Glowing Rank Styling (Immortal Example) */
        .rank-badge {
            color: #a349a4; /* Purple glow for high tier status */
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(163, 73, 164, 0.6);
        }

        .points-display {
            font-size: 14px;
            color: #ffffff;
            text-align: right;
            margin-bottom: 20px;
        }

        .points-highlight {
            color: #66fcf1;
            font-weight: bold;
        }

        /* Section Sub-headings */
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #45a29e;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Gamemode Grid & Lists */
        .tier-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .tier-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(69, 162, 158, 0.2);
            font-size: 15px;
        }

        .mode-name {
            color: #ffffff;
            font-weight: 500;
        }

        .tier-value {
            color: #66fcf1;
            font-weight: bold;
        }

        .points-add {
            color: #45a29e;
            font-size: 12px;
            margin-left: 5px;
        }

        /* Mechanics / Config Footer Layout */
        .manifest-footer {
            background-color: rgba(11, 12, 16, 0.5);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .manifest-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .manifest-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Official Splash Tiers Card Shell -->
    <div class="player-card">
        
        <div class="card-header">
            <p class="brand-title">⚡ Splash Tiers Official Profile</p>
            <h1 class="username">PvPDemon</h1>
        </div>

        <div class="meta-info">
            <span class="region-badge">REGION: ME</span>
            <span class="rank-badge">[ Immortal ]</span>
        </div>
        
        <div class="points-display">
            Score: <span class="points-highlight">148</span> / 1100 PTS
        </div>

        <div class="section-title">⚔️ Current Highest Tiers</div>
        <ul class="tier-list">
            <li class="tier-item">
                <span class="mode-name">Mace</span>
                <span><span class="tier-value">HT1</span><span class="points-add">(+100)</span></span>
            </li>
            <li class="tier-item">
                <span class="mode-name">Spear-Mace</span>
                <span><span class="tier-value">LT2</span><span class="points-add">(+25)</span></span>
            </li>
            <li class="tier-item">
                <span class="mode-name">Sword</span>
                <span><span class="tier-value">HT3</span><span class="points-add">(+12)</span></span>
            </li>
            <li class="tier-item">
                <span class="mode-name">Axe</span>
                <span><span class="tier-value">HT4</span><span class="points-add">(+5)</span></span>
            </li>
            <li class="tier-item">
                <span class="mode-name">Pot</span>
                <span><span class="tier-value">LT4</span><span class="points-add">(+3)</span></span>
            </li>
        </ul>

        <div class="section-title">⚙️ Combat Manifest</div>
        <div class="manifest-footer">
            <div class="manifest-item">
                <span>Input Sensitivity:</span>
                <span style="color: #ffffff;">111</span>
            </div>
            <div class="manifest-item">
                <span>Card Registry:</span>
                <span style="color: #45a29e;">#ME-014</span>
            </div>
        </div>

    </div>

</body>
</html>
