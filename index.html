<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>

:root{
    --bg:#030712;
    --card:#07152d;
    --card2:#101d3a;
    --cyan:#55fff5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:white;
    padding:30px;
}

.container{
    max-width:1500px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:72px;
    font-weight:900;
    margin-bottom:30px;
}

.player-row{
    background:#07152d;
    border-radius:22px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
    margin-bottom:25px;
    cursor:pointer;
}

.player-left{
    display:flex;
    align-items:center;
    gap:22px;
}

.rank{
    font-size:60px;
    font-weight:900;
}

.player-head img{
    width:65px;
    height:65px;
}

.player-info h2{
    font-size:30px;
}

.player-info p{
    color:#8fa9cf;
}

.row-tiers-container{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    width:100%;
    max-width:520px;
}

.micro-tier{
    background:#101d3a;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.micro-tier-label{
    font-size:12px;
    color:#9ab4dc;
}

.micro-tier-rank{
    font-size:18px;
    font-weight:800;
    color:var(--cyan);
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal{
    width:900px;
    max-width:95%;
    background:#04132b;
    border-radius:25px;
    padding:35px;
    position:relative;
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;
    background:red;
    border:none;
    color:white;
    width:45px;
    height:45px;
    border-radius:50%;
    cursor:pointer;
}

.modal-top{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:25px;
}

.best-card{
    background:#101d3a;
    padding:15px;
    border-radius:15px;
    width:160px;
    text-align:center;
}

.modal-avatar{
    text-align:center;
}

.modal-avatar img{
    width:120px;
    height:120px;
}

.modal-name{
    font-size:40px;
    font-weight:900;
}

.modal-rank{
    color:var(--cyan);
}

/* GRID */

.modal-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.modal-box{
    background:#101d3a;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.modal-box-title{
    color:#9ab4dc;
    font-size:14px;
}

.modal-box-rank{
    font-size:20px;
    font-weight:800;
    color:var(--cyan);
}

</style>
</head>

<body>

<div class="container">

<h1 class="title">SPLASH TIERS</h1>

<div id="panel-overall"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">

<div class="modal">

<button class="close-btn" onclick="closeModal()">×</button>

<div class="modal-top">

<div class="best-card">
<div>BEST #1</div>
<div id="best1Name"></div>
<div id="best1Rank"></div>
</div>

<div class="modal-avatar">
<img id="modalHead">
<div class="modal-name" id="modalName"></div>
<div class="modal-rank" id="modalRank"></div>
<div id="modalPoints"></div>
</div>

<div class="best-card">
<div>BEST #2</div>
<div id="best2Name"></div>
<div id="best2Rank"></div>
</div>

</div>

<div class="modal-grid">
<div class="modal-box">Sword <div id="mSword"></div></div>
<div class="modal-box">Axe <div id="mAxe"></div></div>
<div class="modal-box">Pot <div id="mPot"></div></div>
<div class="modal-box">NethPot <div id="mNethPot"></div></div>
<div class="modal-box">UHC <div id="mUHC"></div></div>
<div class="modal-box">SMP <div id="mSMP"></div></div>
<div class="modal-box">Vanilla <div id="mVanilla"></div></div>
<div class="modal-box">Mace <div id="mMace"></div></div>
<div class="modal-box">Cart <div id="mCart"></div></div>
</div>

</div>

</div>

<script>

const players = [
{
name:"PvPDemon",
region:"ME",
rank:"Warlord",
points:440,
avatar:"X-Steve",

sword:"HT3",
axe:"HT4",
pot:"LT4",
nethpot:"HT2",
uhc:"LT2",
smp:"HT5",
vanilla:"HT4",
mace:"HT1",
cart:"LT1"
},
{
name:"coldified",
region:"EU",
rank:"Elite",
points:350,
avatar:"Alex",

sword:"LT1",
axe:"HT3",
pot:"LT4",
nethpot:"LT3",
uhc:"HT2",
smp:"NONE",
vanilla:"HT5",
mace:"LT2",
cart:"HT2"
}
];

// -------------------- TIER VALUE --------------------

function tierValue(v){
if(v==="HT1"||v==="LT1")return 1;
if(v==="HT2"||v==="LT2")return 2;
if(v==="HT3"||v==="LT3")return 3;
if(v==="HT4"||v==="LT4")return 4;
if(v==="HT5"||v==="LT5")return 5;
return 999;
}

// -------------------- AUTO BEST --------------------

function getBestGamemodes(player){

const modes = [
{name:"Sword",v:player.sword},
{name:"Axe",v:player.axe},
{name:"Pot",v:player.pot},
{name:"NethPot",v:player.nethpot},
{name:"UHC",v:player.uhc},
{name:"SMP",v:player.smp},
{name:"Vanilla",v:player.vanilla},
{name:"Mace",v:player.mace},
{name:"Cart",v:player.cart}
].filter(m=>m.v!=="NONE");

modes.sort((a,b)=>tierValue(a.v)-tierValue(b.v));

return {
best1:modes[0],
best2:modes[1]
};
}

// -------------------- RENDER --------------------

function render(){

let html="";

players.forEach((p,i)=>{

html+=`
<div class="player-row" onclick="openModal(${i})">

<div class="player-left">
<div class="rank">${i+1}</div>
<img src="https://visage.surgeplay.com/face/128/${p.avatar}">
<div class="player-info">
<h2>${p.name}</h2>
<p>${p.rank}</p>
</div>
</div>

</div>
`;
});

document.getElementById("panel-overall").innerHTML=html;
}

// -------------------- MODAL --------------------

function openModal(i){

const p=players[i];

document.getElementById("modal").style.display="flex";

document.getElementById("modalHead").src=
`https://visage.surgeplay.com/face/128/${p.avatar}`;

document.getElementById("modalName").innerText=p.name;
document.getElementById("modalRank").innerText=p.rank;
document.getElementById("modalPoints").innerText=p.region+" | "+p.points;

// BEST GAMEMODES (AUTO)
const best = getBestGamemodes(p);

document.getElementById("best1Name").innerText=best.best1.name;
document.getElementById("best1Rank").innerText=best.best1.v;

document.getElementById("best2Name").innerText=best.best2.name;
document.getElementById("best2Rank").innerText=best.best2.v;

// stats
document.getElementById("mSword").innerText=p.sword;
document.getElementById("mAxe").innerText=p.axe;
document.getElementById("mPot").innerText=p.pot;
document.getElementById("mNethPot").innerText=p.nethpot;
document.getElementById("mUHC").innerText=p.uhc;
document.getElementById("mSMP").innerText=p.smp;
document.getElementById("mVanilla").innerText=p.vanilla;
document.getElementById("mMace").innerText=p.mace;
document.getElementById("mCart").innerText=p.cart;

}

function closeModal(){
document.getElementById("modal").style.display="none";
}

render();

</script>

</body>
</html>
