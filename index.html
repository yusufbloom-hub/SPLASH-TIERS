<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>
:root{
    --bg:#030712;
    --card:#07152d;
    --card2:#101d3a;
    --cyan:#55fff5;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:white;
    padding:30px;
}

.container{
    max-width:1500px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:72px;
    font-weight:900;
    margin-bottom:30px;
}

.top-buttons{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

.top-btn{
    text-decoration:none;
    color:white;
    font-size:24px;
    font-weight:800;
    padding:22px 60px;
    border-radius:18px;
    transition:.2s;
}

.discord-btn{ background:linear-gradient(90deg,#3955ff,#4b8fff); }
.server-btn{ background:linear-gradient(90deg,#16b4bd,#28c88f); }

.top-btn:hover{ transform:scale(1.05); }

.nav-tabs{
    background:#08152d;
    border-radius:18px;
    padding:16px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.tab-btn{
    border:none;
    background:#101d3a;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.tab-btn.active{ background:#5bcfd5; }

.player-row{
    background:#07152d;
    border-radius:22px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    cursor:pointer;
}

.player-left{
    display:flex;
    gap:20px;
    align-items:center;
}

.rank{ font-size:50px;font-weight:900; }

.player-head img{ width:60px;height:60px; }

.row-tiers-container{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

.micro-tier{
    background:#101d3a;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

.micro-tier-label{ font-size:12px;color:#aaa; }
.micro-tier-rank{ font-weight:800;color:#55fff5; }

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal{
    background:#07152d;
    padding:30px;
    border-radius:20px;
    width:900px;
    max-width:95%;
}

.close-btn{
    float:right;
    background:red;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.modal-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.best-card{
    background:#101d3a;
    padding:15px;
    border-radius:15px;
    width:160px;
    text-align:center;
}

.modal-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.modal-box{
    background:#101d3a;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.search-admin{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

input{
    padding:10px;
    border-radius:10px;
    border:none;
}

button{
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1 class="title">SPLASH TIERS</h1>

<div class="search-admin">
<input id="searchBox" placeholder="Search player...">
<button onclick="openAdmin()">Admin</button>
</div>

<div class="nav-tabs">
<button class="tab-btn active" onclick="displayTab('overall')">Overall</button>
</div>

<div id="panel-overall"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
<div class="modal">

<button class="close-btn" onclick="closeModal()">X</button>

<div class="modal-top">
<div class="best-card">
<div>BEST #1</div>
<div id="best1Name"></div>
<div id="best1Rank"></div>
</div>

<div>
<h2 id="modalName"></h2>
<p id="modalRank"></p>
<p id="modalPoints"></p>
</div>

<div class="best-card">
<div>BEST #2</div>
<div id="best2Name"></div>
<div id="best2Rank"></div>
</div>
</div>

<div class="modal-grid">
<div class="modal-box">Sword <div id="mSword"></div></div>
<div class="modal-box">Axe <div id="mAxe"></div></div>
<div class="modal-box">Pot <div id="mPot"></div></div>
<div class="modal-box">UHC <div id="mUHC"></div></div>
<div class="modal-box">SMP <div id="mSMP"></div></div>
<div class="modal-box">Cart <div id="mCart"></div></div>
</div>

</div>
</div>

<!-- ADMIN -->
<div id="adminModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;">
<div style="background:#07152d;padding:20px;border-radius:15px;width:300px;text-align:center;">
<h3>Admin Login</h3>
<input id="adminUser" placeholder="Username"><br><br>
<input id="adminPass" type="password" placeholder="Password"><br><br>
<button onclick="loginAdmin()">Login</button>
<p id="err"></p>
</div>
</div>

<script>
const ADMIN_USER="Admin";
const ADMIN_PASS="Lord.of.rings2";

let isAdmin=false;

// LOAD OR DEFAULT
let players = JSON.parse(localStorage.getItem("players")) || [
{
name:"PvPDemon",region:"ME",rank:"Warlord",points:440,avatar:"X-Steve",
sword:"HT3",axe:"HT4",pot:"LT4",uhc:"LT2",smp:"HT5",cart:"LT1"
},
{
name:"coldified",region:"EU",rank:"Elite",points:350,avatar:"Alex",
sword:"LT1",axe:"HT3",pot:"LT4",uhc:"HT2",smp:"NONE",cart:"HT2"
}
];

// SAVE SYSTEM
function save(){
localStorage.setItem("players", JSON.stringify(players));
}

// TIER CONVERT
function tierNum(v){
if(v==="HT1"||v==="LT1")return 1;
if(v==="HT2"||v==="LT2")return 2;
if(v==="HT3"||v==="LT3")return 3;
if(v==="HT4"||v==="LT4")return 4;
if(v==="HT5"||v==="LT5")return 5;
return 999;
}

function format(v){
if(v==="NONE")return "NONE";
return "TIER "+tierNum(v);
}

// SORT
function score(p){
let vals=[p.sword,p.axe,p.pot,p.uhc,p.smp,p.cart];
let t=0,c=0;
vals.forEach(v=>{if(v!=="NONE"){t+=tierNum(v);c++;}});
return t/c;
}

function render(filter=""){
players.sort((a,b)=>score(a)-score(b));
save();

let html="";
players.forEach((p,i)=>{
if(!p.name.toLowerCase().includes(filter))return;

html+=`
<div class="player-row" onclick="openModal(${i})">
<div class="player-left">
<div class="rank">${i+1}</div>
<img src="https://visage.surgeplay.com/face/64/${p.avatar}">
<div>
<h2>${p.name}</h2>
<p>${p.rank}</p>
</div>
</div>
</div>
`;
});

document.getElementById("panel-overall").innerHTML=html;
}

function openModal(i){
let p=players[i];
document.getElementById("modal").style.display="flex";

document.getElementById("modalName").innerText=p.name;
document.getElementById("modalRank").innerText=p.rank;
document.getElementById("modalPoints").innerText=p.region+" | "+p.points;

document.getElementById("mSword").innerText=format(p.sword);
document.getElementById("mAxe").innerText=format(p.axe);
document.getElementById("mPot").innerText=format(p.pot);
document.getElementById("mUHC").innerText=format(p.uhc);
document.getElementById("mSMP").innerText=format(p.smp);
document.getElementById("mCart").innerText=format(p.cart);

// best
let modes=[
["Sword",p.sword],
["Axe",p.axe],
["Pot",p.pot],
["UHC",p.uhc],
["SMP",p.smp],
["Cart",p.cart]
];

modes.sort((a,b)=>tierNum(a[1])-tierNum(b[1]));

document.getElementById("best1Name").innerText=modes[0][0];
document.getElementById("best1Rank").innerText=format(modes[0][1]);

document.getElementById("best2Name").innerText=modes[1][0];
document.getElementById("best2Rank").innerText=format(modes[1][1]);
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

// SEARCH
document.getElementById("searchBox").addEventListener("input",(e)=>{
render(e.target.value.toLowerCase());
});

// ADMIN
function openAdmin(){
document.getElementById("adminModal").style.display="flex";
}

function loginAdmin(){
if(
document.getElementById("adminUser").value===ADMIN_USER &&
document.getElementById("adminPass").value===ADMIN_PASS
){
isAdmin=true;
document.getElementById("adminModal").style.display="none";
alert("Admin logged in");
}else{
document.getElementById("err").innerText="Wrong login";
}
}

// INIT
render();
</script>

</body>
</html>
