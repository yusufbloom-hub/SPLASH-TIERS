```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>
:root {
    --bg-main: #0a0d14;
    --bg-panel: #121824;
    --bg-row: #171f2e;
    --bg-row-hover: #1f2a3e;
    --accent-cyan: #66fcf1;
    --accent-blue: #45a29e;
    --text-main: #ffffff;
    --text-muted: #7e8e9f;
}

body {
    background: var(--bg-main);
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.nav-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 20px;
    background: var(--bg-panel);
    padding: 10px;
    border-radius: 10px;
}

.tab-btn {
    border: none;
    background: var(--bg-row);
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.tab-btn.active {
    background: var(--accent-blue);
}

.view-section {
    display: none;
}

.view-section.active {
    display: block;
}

.leaderboard-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player-row {
    background: var(--bg-panel);
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
}

.player-row:hover {
    background: var(--bg-row-hover);
}

.rank-num {
    font-size: 22px;
    font-weight: bold;
    width: 40px;
}

.avatar-box img {
    width: 40px;
    border-radius: 6px;
}

.player-details {
    width: 220px;
}

.player-name {
    font-weight: bold;
    font-size: 18px;
}

.player-rank-status {
    color: var(--text-muted);
}

.rank-points {
    color: var(--accent-cyan);
}

.row-tiers-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-left: auto;
}

.micro-tier {
    background: rgba(255,255,255,0.05);
    padding: 5px;
    border-radius: 5px;
    text-align: center;
    min-width: 50px;
}

.micro-tier-label {
    display: block;
    font-size: 10px;
    color: var(--text-muted);
}

.columns-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.tier-column {
    background: var(--bg-panel);
    padding: 10px;
    border-radius: 10px;
}

.column-header {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.column-player-card {
    background: var(--bg-row);
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.column-player-card img {
    width: 28px;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-card {
    background: var(--bg-panel);
    width: 600px;
    padding: 25px;
    border-radius: 16px;
}

.modal-header-block {
    text-align: center;
}

.modal-avatar-circle img {
    width: 80px;
}

.modal-tiers-grid {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.modal-tier-card {
    background: var(--bg-row);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}

.close-btn {
    float: right;
    border: none;
    background: red;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="container">

<div class="nav-tabs">
<button class="tab-btn active" id="btn-overall" onclick="displayTab('overall')">Overall</button>
<button class="tab-btn" id="btn-sword" onclick="displayTab('sword')">Sword</button>
<button class="tab-btn" id="btn-axe" onclick="displayTab('axe')">Axe</button>
<button class="tab-btn" id="btn-pot" onclick="displayTab('pot')">Pot</button>
<button class="tab-btn" id="btn-nethpot" onclick="displayTab('nethpot')">NethPot</button>
<button class="tab-btn" id="btn-uhc" onclick="displayTab('uhc')">UHC</button>
<button class="tab-btn" id="btn-smp" onclick="displayTab('smp')">SMP</button>
<button class="tab-btn" id="btn-diamondsmp" onclick="displayTab('diamondsmp')">Diamond SMP</button>
<button class="tab-btn" id="btn-vanilla" onclick="displayTab('vanilla')">Vanilla</button>
<button class="tab-btn" id="btn-mace" onclick="displayTab('mace')">Mace</button>
<button class="tab-btn" id="btn-spear" onclick="displayTab('spear')">Spear</button>
<button class="tab-btn" id="btn-spearmace" onclick="displayTab('spearmace')">Spear Mace</button>
<button class="tab-btn" id="btn-cart" onclick="displayTab('cart')">Cart</button>
</div>

<div id="panel-overall" class="view-section active">
<div class="leaderboard-list"></div>
</div>

<div id="panel-columns" class="view-section">
<div class="columns-container" id="columns-matrix"></div>
</div>

</div>

<div class="modal-overlay" id="playerModal" onclick="closeInspect()">
<div class="modal-card" onclick="event.stopPropagation()">
<button class="close-btn" onclick="closeInspect()">X</button>

<div class="modal-header-block">
<div class="modal-avatar-circle">
<img id="modal-img" src="">
</div>

<h2 id="modal-name"></h2>
<div id="modal-rank"></div>

<p>
<span id="modal-region"></span>
|
<span id="modal-points"></span> / 720
</p>
</div>

<div class="modal-tiers-grid">
<div class="modal-tier-card"><div>Sword</div><div id="m-sword"></div></div>
<div class="modal-tier-card"><div>Axe</div><div id="m-axe"></div></div>
<div class="modal-tier-card"><div>Pot</div><div id="m-pot"></div></div>
<div class="modal-tier-card"><div>NethPot</div><div id="m-nethpot"></div></div>
<div class="modal-tier-card"><div>UHC</div><div id="m-uhc"></div></div>
<div class="modal-tier-card"><div>SMP</div><div id="m-smp"></div></div>
<div class="modal-tier-card"><div>Diamond SMP</div><div id="m-diamondsmp"></div></div>
<div class="modal-tier-card"><div>Vanilla</div><div id="m-vanilla"></div></div>
<div class="modal-tier-card"><div>Mace</div><div id="m-mace"></div></div>
<div class="modal-tier-card"><div>Spear</div><div id="m-spear"></div></div>
<div class="modal-tier-card"><div>Spear Mace</div><div id="m-spearmace"></div></div>
<div class="modal-tier-card"><div>Cart</div><div id="m-cart"></div></div>
</div>
</div>
</div>

<script>
const GAMEMODES = [
'sword',
'axe',
'pot',
'nethpot',
'uhc',
'smp',
'diamondsmp',
'vanilla',
'mace',
'spear',
'spearmace',
'cart'
];

const tierPoints = {
'HT1': 60,
'LT1': 55,
'HT2': 50,
'LT2': 45,
'HT3': 40,
'LT3': 35,
'HT4': 30,
'LT4': 25,
'HT5': 20,
'LT5': 15,
'NONE': 0
};

const playersDB = [
{
name: 'PvPDemon',
region: 'ME',
avatar: 'X-Steve',

sword: 'HT3',
axe: 'HT4',
pot: 'LT4',
nethpot: 'HT2',
uhc: 'LT2',
smp: 'HT5',
diamondsmp: 'NONE',
vanilla: 'HT4',
mace: 'HT1',
spear: 'LT2',
spearmace: 'HT3',
cart: 'LT1'
},

{
name: 'coldified',
region: 'EU',
avatar: 'Alex',

sword: 'LT1',
axe: 'HT3',
pot: 'LT4',
nethpot: 'LT3',
uhc: 'HT2',
smp: 'NONE',
diamondsmp: 'NONE',
vanilla: 'HT5',
mace: 'LT2',
spear: 'NONE',
spearmace: 'HT4',
cart: 'HT2'
}
];

function calculatePoints(player) {
let total = 0;

GAMEMODES.forEach(mode => {
total += tierPoints[player[mode]] || 0;
});

return total;
}

function getRank(points) {
if (points >= 600) return 'Godlike';
if (points >= 500) return 'Immortal';
if (points >= 400) return 'Warlord';
if (points >= 300) return 'Elite';
if (points >= 200) return 'Knight';
return 'Rookie';
}

function buildTierCards(player) {

const names = {
sword: 'Swd',
axe: 'Axe',
pot: 'Pot',
nethpot: 'NPot',
uhc: 'UHC',
smp: 'SMP',
diamondsmp: 'DSMP',
vanilla: 'Van',
mace: 'Mace',
spear: 'Spr',
spearmace: 'S-M',
cart: 'Cart'
};

let html = '';

GAMEMODES.forEach(mode => {
html += `
<div class="micro-tier">
<span class="micro-tier-label">${names[mode]}</span>
<span>${player[mode]}</span>
</div>
`;
});

return html;
}

function buildLeaderboard() {

const leaderboard = document.querySelector('.leaderboard-list');
leaderboard.innerHTML = '';

playersDB.forEach(player => {
player.points = calculatePoints(player);
player.rank = getRank(player.points);
});

playersDB.sort((a,b) => b.points - a.points);

playersDB.forEach((player,index) => {

const row = document.createElement('div');
row.className = 'player-row';
row.onclick = () => inspectPlayer(player);

row.innerHTML = `
<div class="rank-num">${index + 1}</div>

<div class="avatar-box">
<img src="https://visage.surgeplay.com/face/64/${player.avatar}">
</div>

<div class="player-details">
<div class="player-name">${player.name}</div>
<div class="player-rank-status">
${player.rank}
(<span class="rank-points">${player.points} pts</span>)
</div>
</div>

<div class="row-tiers-container">
${buildTierCards(player)}
</div>
`;

leaderboard.appendChild(row);
});
}

function displayTab(tab) {

 document.querySelectorAll('.tab-btn').forEach(btn => {
 btn.classList.remove('active');
 });

 document.getElementById('btn-' + tab).classList.add('active');

 document.querySelectorAll('.view-section').forEach(section => {
 section.classList.remove('active');
 });

 if (tab === 'overall') {
 document.getElementById('panel-overall').classList.add('active');
 return;
 }

 buildColumnLayout(tab);
 document.getElementById('panel-columns').classList.add('active');
}

function buildColumnLayout(gamemode) {

const matrix = document.getElementById('columns-matrix');
matrix.innerHTML = '';

const tiers = [
{ title: 'Tier 1', matches: ['HT1','LT1'] },
{ title: 'Tier 2', matches: ['HT2','LT2'] },
{ title: 'Tier 3', matches: ['HT3','LT3'] },
{ title: 'Tier 4', matches: ['HT4','LT4'] },
{ title: 'Tier 5', matches: ['HT5','LT5'] }
];

 tiers.forEach(tier => {

 let html = `
 <div class="tier-column">
 <div class="column-header">${tier.title}</div>
 `;

 playersDB.forEach(player => {

 if (tier.matches.includes(player[gamemode])) {
 html += `
 <div class="column-player-card">
 <img src="https://visage.surgeplay.com/face/64/${player.avatar}">
 <span>${player.name} (${player[gamemode]})</span>
 </div>
 `;
 }
 });

 html += `</div>`;
 matrix.innerHTML += html;
 });
}

function inspectPlayer(player) {

 document.getElementById('playerModal').style.display = 'flex';

 document.getElementById('modal-img').src =
 `https://visage.surgeplay.com/face/64/${player.avatar}`;

 document.getElementById('modal-name').innerText = player.name;
 document.getElementById('modal-rank').innerText = player.rank;
 document.getElementById('modal-region').innerText = player.region;
 document.getElementById('modal-points').innerText = player.points;

 document.getElementById('m-sword').innerText = player.sword;
 document.getElementById('m-axe').innerText = player.axe;
 document.getElementById('m-pot').innerText = player.pot;
 document.getElementById('m-nethpot').innerText = player.nethpot;
 document.getElementById('m-uhc').innerText = player.uhc;
 document.getElementById('m-smp').innerText = player.smp;
 document.getElementById('m-diamondsmp').innerText = player.diamondsmp;
 document.getElementById('m-vanilla').innerText = player.vanilla;
 document.getElementById('m-mace').innerText = player.mace;
 document.getElementById('m-spear').innerText = player.spear;
 document.getElementById('m-spearmace').innerText = player.spearmace;
 document.getElementById('m-cart').innerText = player.cart;
}

function closeInspect() {
document.getElementById('playerModal').style.display = 'none';
}

buildLeaderboard();
</script>

</body>
</html>
