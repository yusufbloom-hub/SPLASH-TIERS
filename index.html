<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>
:root {
    --bg: #0a0e17;
    --card: #111827;
    --card-hover: #1f2937;
    --cyan: #38bdf8;
    
    /* Official-style Tier Badge Colors */
    --t1: #ef4444; /* Red */
    --t2: #f97316; /* Orange */
    --t3: #eab308; /* Yellow */
    --t4: #22c55e; /* Green */
    --t5: #3b82f6; /* Blue */
    --t-none: #374151; /* Dark Gray */

    /* Podium Colors */
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: var(--bg);
    color: #f3f4f6;
    padding: 40px 20px;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.title {
    text-align: center;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-transform: uppercase;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    font-size: 18px;
    margin-bottom: 40px;
}

.top-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 50px;
}

.top-btn {
    text-decoration: none;
    color: white;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 10px;
    transition: .2s;
}

.discord-btn { background: #4f46e5; }
.server-btn { background: #0891b2; }
.top-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

/* Table Headers like mctiers */
.leaderboard-header {
    display: grid;
    grid-template-columns: 350px 1fr;
    padding: 10px 24px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.header-kits {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
    text-align: center;
}

/* Player Rows */
.player-row {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 24px;
    display: grid;
    grid-template-columns: 350px 1fr;
    align-items: center;
    margin-bottom: 12px;
    cursor: pointer;
    border: 1px solid #1f2937;
    transition: background 0.2s, transform 0.2s;
}

.player-row:hover {
    background: var(--card-hover);
    transform: scale(1.005);
}

.player-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.rank-num {
    font-size: 20px;
    font-weight: 800;
    width: 30px;
    color: #4b5563;
}

/* Podium styling for top 3 */
.pos-1 .rank-num { color: var(--gold); }
.pos-2 .rank-num { color: var(--silver); }
.pos-3 .rank-num { color: var(--bronze); }

.player-head img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
}

.player-meta h2 {
    font-size: 18px;
    font-weight: 700;
    color: white;
}

.player-meta p {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 2px;
}

.player-meta span {
    color: var(--cyan);
    font-weight: 600;
}

/* Kits Grid System */
.row-tiers-container {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
}

/* Universal Tier Badge Styling */
.tier-badge {
    padding: 6px 0;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
}

.badge-ht1, .badge-lt1 { background: var(--t1); color: white; }
.badge-ht2, .badge-lt2 { background: var(--t2); color: white; }
.badge-ht3, .badge-lt3 { background: var(--t3); color: #111827; }
.badge-ht4, .badge-lt4 { background: var(--t4); color: white; }
.badge-ht5, .badge-lt5 { background: var(--t5); color: white; }
.badge-none { background: var(--t-none); color: #9ca3af; }

/* Modal Design */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.modal {
    width: 600px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 32px;
    position: relative;
}

.close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 24px;
    cursor: pointer;
}

.close-btn:hover { color: white; }

.modal-top {
    text-align: center;
    margin-bottom: 24px;
}

.modal-avatar img {
    width: 96px;
    height: 96px;
    border-radius: 12px;
    margin-bottom: 16px;
}

.modal-name { font-size: 32px; font-weight: 800; }
.modal-rank { color: var(--cyan); font-size: 20px; font-weight: 600; margin-top: 4px; }
.modal-points { font-size: 14px; color: #6b7280; margin-top: 4px; }

.modal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.modal-box {
    background: #1f2937;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
}

.modal-box-title { font-size: 12px; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }

@media (max-width: 1200px) {
    .leaderboard-header { display: none; }
    .player-row { grid-template-columns: 1fr; gap: 16px; }
    .row-tiers-container { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>

<div class="container">
    <h1 class="title">SPLASH TIERS</h1>
    <p class="subtitle">Official Player Rankings & Leaderboard</p>

    <div class="top-buttons">
        <a href="#" class="top-btn discord-btn">🎮 Discord Server</a>
        <a href="#" class="top-btn server-btn">🖥️ Server IP</a>
    </div>

    <!-- Column Headers like mctiers -->
    <div class="leaderboard-header">
        <div>Player Info</div>
        <div class="header-kits">
            <div>Sword</div><div>Axe</div><div>Pot</div><div>NethPot</div><div>UHC</div><div>SMP</div><div>Vanilla</div><div>Mace</div><div>Cart</div>
        </div>
    </div>

    <div id="leaderboard"></div>
</div>

<!-- Modal Structure -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <div class="modal-top">
            <div class="modal-avatar">
                <img id="modalHead" src="">
                <div class="modal-name" id="modalName"></div>
                <div class="modal-rank" id="modalRank"></div>
                <div class="modal-points" id="modalPoints"></div>
            </div>
        </div>
        <div class="modal-grid">
            <div class="modal-box"><div class="modal-box-title">Sword</div><div id="mSword"></div></div>
            <div class="modal-box"><div class="modal-box-title">Axe</div><div id="mAxe"></div></div>
            <div class="modal-box"><div class="modal-box-title">Pot</div><div id="mPot"></div></div>
            <div class="modal-box"><div class="modal-box-title">NethPot</div><div id="mNethPot"></div></div>
            <div class="modal-box"><div class="modal-box-title">UHC</div><div id="mUHC"></div></div>
            <div class="modal-box"><div class="modal-box-title">SMP</div><div id="mSMP"></div></div>
            <div class="modal-box"><div class="modal-box-title">Vanilla</div><div id="mVanilla"></div></div>
            <div class="modal-box"><div class="modal-box-title">Mace</div><div id="mMace"></div></div>
            <div class="modal-box"><div class="modal-box-title">Cart</div><div id="mCart"></div></div>
        </div>
    </div>
</div>

<script>
const tierPointsMapping = {
    "HT1": 60, "LT1": 50, "HT2": 40, "LT2": 30, "HT3": 25, 
    "LT3": 20, "HT4": 15, "LT4": 10, "HT5": 10, "LT5": 5, "NONE": 0
};

const players = [
    {
        name: "YsplashMC",
        region: "ME",
        avatar: "images/Ysplash_CC.png",
        sword: "HT5", axe: "HT5", pot: "HT5", nethpot: "LT5", uhc: "HT5", smp: "HT5", vanilla: "LT4", mace: "HT5", cart: "HT5"
    },
    {
        name: "NinjaRLCS",
        region: "ME",
        avatar: "images/NinjaRLCS.png",
        sword: "HT5", axe: "NONE", pot: "NONE", nethpot: "NONE", uhc: "NONE", smp: "NONE", vanilla: "LT5", mace: "HT5", cart: "LT5"
    }
];

function calculateRankName(points) {
    if (points >= 500) return "Combat Grandmaster";
    if (points >= 400) return "Combat Master";
    if (points >= 300) return "Ace";
    if (points >= 200) return "Specialist";
    if (points >= 100) return "Cadat";
    if (points >= 50)  return "Novis";
    return "Rookie";
}

// Function to generate the correct styling class based on tier name
function getBadgeClass(tier) {
    if (!tier || tier === "NONE") return "tier-badge badge-none";
    return `tier-badge badge-${tier.toLowerCase()}`;
}

function buildLeaderboard() {
    players.forEach(player => {
        let total = 0;
        const kits = ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'];
        kits.forEach(kit => { total += tierPointsMapping[player[kit] || "NONE"]; });
        player.points = total;
        player.rank = calculateRankName(total);
    });

    players.sort((a, b) => b.points - a.points);
    const container = document.getElementById("leaderboard");
    container.innerHTML = ""; 

    players.forEach((player, index) => {
        const place = index + 1;
        const kitsList = ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'];
        
        let kitsHTML = "";
        kitsList.forEach(k => {
            const val = player[k] || "NONE";
            kitsHTML += `<div class="${getBadgeClass(val)}">${val}</div>`;
        });

        const rowHTML = `
            <div class="player-row pos-${place}" onclick="openModalByIndex(${index})">
                <div class="player-left">
                    <div class="rank-num">${place}</div>
                    <div class="player-head">
                        <img src="${player.avatar}" onerror="this.src='https://placehold.co/48x48/1f2937/fff?text=${player.name[0]}'">
                    </div>
                    <div class="player-info">
                        <h2>${player.name}</h2>
                        <p>${player.rank} <span>(${player.points} pts)</span></p>
                    </div>
                </div>
                <div class="row-tiers-container">
                    ${kitsHTML}
                </div>
            </div>
        `;
        container.innerHTML += rowHTML;
    });
}

function openModalByIndex(index) {
    const player = players[index];
    if(!player) return;

    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalHead").src = player.avatar;
    document.getElementById("modalName").innerText = player.name;
    document.getElementById("modalRank").innerText = player.rank;
    document.getElementById("modalPoints").innerText = `${player.region} | ${player.points} / 540 PTS`;

    const kits = ['sword','axe','pot','nethpot','uhc','smp','vanilla','mace','cart'];
    const targets = ['mSword','mAxe','mPot','mNethPot','mUHC','mSMP','mVanilla','mMace','mCart'];
    
    kits.forEach((kit, i) => {
        const val = player[kit] || "NONE";
        const el = document.getElementById(targets[i]);
        el.className = getBadgeClass(val);
        el.innerText = val;
    });
}

function closeModal(){ document.getElementById("modal").style.display = "none"; }
window.onload = buildLeaderboard;
</script>
</body>
</html>
