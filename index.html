<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Tiers</title>

<style>

:root{
    --bg:#030712;
    --card:#07152d;
    --card2:#101d3a;
    --cyan:#55fff5;
    
    /* Podium Colors */
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:white;
    padding:30px;
}

.container{
    max-width:1500px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:72px;
    font-weight:900;
    margin-bottom:30px;
}

.top-buttons{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

.top-btn{
    text-decoration:none;
    color:white;
    font-size:24px;
    font-weight:800;
    padding:22px 60px;
    border-radius:18px;
    transition:.2s;
}

.discord-btn{
    background:linear-gradient(90deg,#3955ff,#4b8fff);
}

.server-btn{
    background:linear-gradient(90deg,#16b4bd,#28c88f);
}

.top-btn:hover{
    transform:scale(1.05);
}

/* Leaderboard Container where JS injects rows */
#leaderboard{
    width: 100%;
}

.player-row{
    background:#07152d;
    border-radius:22px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
    margin-bottom:25px;
    cursor:pointer;
    border: 3px solid transparent; /* Base state */
    transition: transform 0.2s, box-shadow 0.2s;
}

.player-row:hover {
    transform: translateY(-2px);
}

/* Top 3 Podium Outlines & Glows */
.rank-1 {
    border-color: var(--gold);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
}
.rank-1 .rank { color: var(--gold); }

.rank-2 {
    border-color: var(--silver);
    box-shadow: 0 0 15px rgba(192, 192, 192, 0.2);
}
.rank-2 .rank { color: var(--silver); }

.rank-3 {
    border-color: var(--bronze);
    box-shadow: 0 0 15px rgba(205, 127, 50, 0.2);
}
.rank-3 .rank { color: var(--bronze); }


.player-left{
    display:flex;
    align-items:center;
    gap:22px;
    min-width:320px;
}

.rank{
    font-size:64px;
    font-weight:900;
    width: 60px;
    text-align: center;
}

.player-head img{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
}

.player-info h2{
    font-size:30px;
    margin-bottom:4px;
}

.player-info p{
    font-size:20px;
    color:#8fa9cf;
}

.player-info span{
    color:var(--cyan);
    font-weight:800;
}

.row-tiers-container{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    width:100%;
    max-width:520px;
}

.micro-tier{
    background:#101d3a;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.micro-tier-label{
    font-size:12px;
    color:#9ab4dc;
    margin-bottom:4px;
}

.micro-tier-rank{
    font-size:18px;
    font-weight:800;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal{
    width:950px;
    max-width:95%;
    max-height: 90vh;
    background:#04132b;
    border-radius:25px;
    padding:35px;
    position:relative;
    overflow-y: auto;
}

.close-btn{
    position:absolute;
    top:18px;
    right:18px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    font-size:26px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:1010;
}

.modal-top{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
}

.modal-avatar{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.modal-avatar img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
}

.modal-name{
    font-size:62px;
    font-weight:900;
    margin-top:12px;
}

.modal-rank{
    color:var(--cyan);
    font-size:32px;
    margin-top:6px;
}

.modal-points{
    margin-top:10px;
    font-size:24px;
}

.modal-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.modal-box{
    background:#0d1d3f;
    border-radius:15px;
    padding:18px;
    text-align:center;
}

.modal-box-title{
    color:#9ab4dc;
    margin-bottom:10px;
}

.modal-box-rank{
    color:var(--cyan);
    font-size:24px;
    font-weight:900;
}

@media(max-width:1100px){

    .player-row{
        flex-direction:column;
        align-items:flex-start;
    }

    .row-tiers-container{
        grid-template-columns:repeat(3,1fr);
        max-width:100%;
    }

    .modal-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .modal-top {
        padding-top: 30px;
    }

    .modal-name {
        font-size: 42px;
        text-align: center;
    }

}

</style>
</head>
<body>

<div class="container">

<h1 class="title">SPLASH TIERS</h1>

<div class="top-buttons">
    <a href="#" class="top-btn discord-btn">🎮 Discord Server</a>
    <a href="#" class="top-btn server-btn">🖥️ Server IP</a>
</div>

<!-- Dynamic Leaderboard target -->
<div id="leaderboard"></div>

</div>

<!-- Modal Structure -->
<div class="modal-overlay" id="modal">
<div class="modal">
<button class="close-btn" onclick="closeModal()">×</button>
<div class="modal-top">
<div class="modal-avatar">
<img id="modalHead" src="">
<div class="modal-name" id="modalName"></div>
<div class="modal-rank" id="modalRank"></div>
<div class="modal-points" id="modalPoints"></div>
<div class="modal-points" id="modalPlatform"></div>
<div class="modal-points" id="modalDevice"></div>
</div>
</div>

<div class="modal-grid">
<div class="modal-box"><div class="modal-box-title">Sword</div><div class="modal-box-rank" id="mSword"></div></div>
<div class="modal-box"><div class="modal-box-title">Axe</div><div class="modal-box-rank" id="mAxe"></div></div>
<div class="modal-box"><div class="modal-box-title">Pot</div><div class="modal-box-rank" id="mPot"></div></div>
<div class="modal-box"><div class="modal-box-title">NethPot</div><div class="modal-box-rank" id="mNethPot"></div></div>
<div class="modal-box"><div class="modal-box-title">UHC</div><div class="modal-box-rank" id="mUHC"></div></div>
<div class="modal-box"><div class="modal-box-title">SMP</div><div class="modal-box-rank" id="mSMP"></div></div>
<div class="modal-box"><div class="modal-box-title">Diamond SMP</div><div class="modal-box-rank" id="mDSMP"></div></div>
<div class="modal-box"><div class="modal-box-title">Vanilla</div><div class="modal-box-rank" id="mVanilla"></div></div>
<div class="modal-box"><div class="modal-box-title">Mace</div><div class="modal-box-rank" id="mMace"></div></div>
<div class="modal-box"><div class="modal-box-title">Spear</div><div class="modal-box-rank" id="mSpear"></div></div>
<div class="modal-box"><div class="modal-box-title">Spear Mace</div><div class="modal-box-rank" id="mSM"></div></div>
<div class="modal-box"><div class="modal-box-title">Cart</div><div class="modal-box-rank" id="mCart"></div></div>
</div>
</div>
</div>

<script>

// 1. Point Allocation Values
const tierPointsMapping = {
    "HT1": 60, "LT1": 55,
    "HT2": 50, "LT2": 45,
    "HT3": 40, "LT3": 35,
    "HT4": 30, "LT4": 25,
    "HT5": 20, "LT5": 15,
    "NONE": 0
};

// 2. Pure Java Player Database
const players = [
    {
        name: "Ysplash_CC",
        region: "ME",
        avatar: "images/Ysplash_CC.png",
        platform: "Java",
        device: "PC",
        sword: "HT5", axe: "HT5", pot: "HT5", nethpot: "LT5", uhc: "HT5", smp: "HT5",
        diamondsmp: "HT5", vanilla: "LT4", mace: "HT5", spear: "NONE", spearmace: "LT5", cart: "HT5"
    },
    {
        name: "NinjaRLCS",
        region: "ME",
        avatar: "images/NinjaRLCS.png",
        platform: "Java",
        device: "PC",
        sword: "HT5", axe: "NONE", pot: "NONE", nethpot: "NONE", uhc: "NONE", smp: "NONE",
        diamondsmp: "LT5", vanilla: "LT5", mace: "HT5", spear: "NONE", spearmace: "NONE", cart: "LT5"
    },
    {
        name: "SampleElite",
        region: "EU",
        avatar: "images/default.png",
        platform: "Java",
        device: "PC",
        sword: "LT1", axe: "HT3", pot: "NONE", nethpot: "NONE", uhc: "LT2", smp: "NONE",
        diamondsmp: "NONE", vanilla: "NONE", mace: "HT1", spear: "NONE", spearmace: "NONE", cart: "NONE"
    }
];

// 3. Automated Rank Names based on point values
function calculateRankName(points) {
    if (points >= 200) return "Splash Master";
    if (points >= 120) return "Combat Master";
    if (points >= 60)  return "Elite Combatant";
    if (points >= 20)  return "Combat Cadet";
    return "Rookie";
}

// 4. Engine: Computes scores, assigns ranks, sorts, and renders the UI
function buildLeaderboard() {
    // Run automated point calculators
    players.forEach(player => {
        let total = 0;
        const kits = ['sword','axe','pot','nethpot','uhc','smp','diamondsmp','vanilla','mace','spear','spearmace','cart'];
        
        kits.forEach(kit => {
            const rank = player[kit] || "NONE";
            total += tierPointsMapping[rank] || 0;
        });
        
        player.points = total;
        player.rank = calculateRankName(total);
    });

    // Sort players by points from High to Low
    players.sort((a, b) => b.points - a.points);

    // Render HTML Rows dynamically
    const container = document.getElementById("leaderboard");
    container.innerHTML = ""; 

    players.forEach((player, index) => {
        const place = index + 1;
        
        // Match ranking tier styles for podium outlines
        let podiumClass = "";
        if (place === 1) podiumClass = "rank-1";
        else if (place === 2) podiumClass = "rank-2";
        else if (place === 3) podiumClass = "rank-3";

        // Gather 6 visible kit micro-tiers for overview preview summary
        const previewKits = [
            {label: "Sword", val: player.sword},
            {label: "Axe", val: player.axe},
            {label: "Pot", val: player.pot},
            {label: "UHC", val: player.uhc},
            {label: "Mace", val: player.mace},
            {label: "Cart", val: player.cart}
        ];

        let microTiersHTML = "";
        previewKits.forEach(k => {
            if(k.val !== "NONE") {
                microTiersHTML += `<div class="micro-tier"><div class="micro-tier-label">${k.label}</div><div class="micro-tier-rank">${k.val}</div></div>`;
            }
        });

        const rowHTML = `
            <div class="player-row ${podiumClass}" onclick="openModalByIndex(${index})">
                <div class="player-left">
                    <div class="rank">${place}</div>
                    <div class="player-head">
                        <img src="${player.avatar}" onerror="this.src='https://placehold.co/65x65/101d3a/fff?text=${player.name[0]}'">
                    </div>
                    <div class="player-info">
                        <h2>${player.name}</h2>
                        <p>${player.rank} <span>(${player.points} pts)</span></p>
                    </div>
                </div>
                <div class="row-tiers-container">
                    ${microTiersHTML}
                </div>
            </div>
        `;
        container.innerHTML += rowHTML;
    });
}

// 5. Open Modal Function based on Index position
function openModalByIndex(index) {
    const player = players[index];
    if(!player) return;

    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalHead").src = player.avatar;
    document.getElementById("modalName").innerText = player.name;
    document.getElementById("modalRank").innerText = player.rank;
    document.getElementById("modalPoints").innerText = `${player.region} | ${player.points} pts`;
    document.getElementById("modalPlatform").innerText = `☕ ${player.platform} Edition`;
    document.getElementById("modalDevice").innerText = `🖥️ ${player.device}`;

    // Fill in stats grid details
    document.getElementById("mSword").innerText = player.sword;
    document.getElementById("mAxe").innerText = player.axe;
    document.getElementById("mPot").innerText = player.pot;
    document.getElementById("mNethPot").innerText = player.nethpot;
    document.getElementById("mUHC").innerText = player.uhc;
    document.getElementById("mSMP").innerText = player.smp;
    document.getElementById("mDSMP").innerText = player.diamondsmp;
    document.getElementById("mVanilla").innerText = player.vanilla;
    document.getElementById("mMace").innerText = player.mace;
    document.getElementById("mSpear").innerText = player.spear;
    document.getElementById("mSM").innerText = player.spearmace;
    document.getElementById("mCart").innerText = player.cart;
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

// Initialize on page bootup
window.onload = buildLeaderboard;

</script>
</body>
</html>
